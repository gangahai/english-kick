<!doctype html><html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1024"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-512.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="English Kick"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>English Kick 3D</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: full-screen WebGL stadium; HTML HUD floats on top (scoreboard + question top, result bar bottom). Deliberately single dark theme: a night match. */
:root{
  color-scheme: dark;
  --night:#060a1a; --panel:rgba(16,24,52,.86); --line:#2a3a6e;
  --ink:#f2f5fc; --muted:#a8b3d0; --led:#ffc23d; --good:#3ee07f; --bad:#ff5a5f;
  --team:#1f53d6; --team-ink:#fff;
  --f-display:"Secular One","Rubik",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,sans-serif;
  --f-en:"Andika","Rubik",system-ui,sans-serif;
  --f-led:"Bungee","Rubik",system-ui,sans-serif;
}
body[data-team="maccabi"]{ --team:#0b8f3e; }
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--led);outline-offset:3px}
.en{direction:ltr;unicode-bidi:isolate;font-family:var(--f-en)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}

.hud-top{position:fixed;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:8px;pointer-events:none;max-width:640px;margin:0 auto}
.hud-top > *{pointer-events:auto}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:rgba(3,5,12,.82);border:2px solid #1d2747;border-radius:14px;padding:8px 12px;backdrop-filter:blur(6px)}
.board .side{font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center;min-width:0}
.board .side:last-child{justify-content:flex-end}
.board .side i{width:12px;height:12px;border-radius:3px;flex:none}
.score{font-family:var(--f-led);font-size:26px;color:var(--led);direction:ltr;text-shadow:0 0 12px rgba(255,194,61,.5);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px;justify-content:center;direction:ltr}
.dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.18);display:block}
.dots i.g{background:var(--good)} .dots i.s{background:var(--bad)} .dots i.now{outline:2px solid var(--led);outline-offset:1px}
.prompt{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;backdrop-filter:blur(6px)}
.prompt .vis{font-size:42px;line-height:1;min-width:52px;text-align:center}
.prompt .ask{font-weight:700;font-size:17px;line-height:1.3}
.prompt .sub{color:var(--muted);font-size:14px;margin-top:3px}
.prompt .sub .en{font-size:21px;color:var(--ink)}
.speak{width:50px;height:50px;border-radius:50%;background:var(--team);color:var(--team-ink);font-size:22px;display:grid;place-items:center}
.speak.pulse{animation:pulse 1s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,194,61,.7)}100%{box-shadow:0 0 0 18px rgba(255,194,61,0)}}

.big{position:fixed;left:0;right:0;top:38%;text-align:center;font-family:var(--f-led);font-size:clamp(54px,16vw,110px);direction:ltr;pointer-events:none;opacity:0;transform:scale(.4);transition:transform .3s cubic-bezier(.2,1.5,.4,1),opacity .2s;text-shadow:0 6px 0 rgba(0,0,0,.45),0 0 30px currentColor}
.big.show{opacity:1;transform:scale(1)}
.big.g{color:var(--good)} .big.s{color:var(--bad)}
.replay{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);inset-inline-start:max(16px,env(safe-area-inset-left,0px));font-family:var(--f-led);font-size:18px;direction:ltr;background:rgba(0,0,0,.6);padding:6px 12px;border-radius:8px;display:flex;align-items:center;gap:8px}
.replay i{width:12px;height:12px;border-radius:50%;background:var(--bad);animation:blink 1s infinite}
.replay small{font-family:var(--f-body);font-size:12px;color:var(--muted)}
@keyframes blink{50%{opacity:.2}}
.bar{position:fixed;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center}
.bar-in{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;backdrop-filter:blur(8px);animation:up .3s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.bar-in .txt{flex:1;min-width:0}
.bar-in .lab{font-size:13px;color:var(--muted)}
.bar-in .word{font-size:26px;font-weight:700}
.bar-in .heb{font-size:14px;color:var(--muted)}
.next{background:var(--team);color:var(--team-ink);border-radius:12px;padding:12px 16px;font-weight:700;white-space:nowrap}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);text-align:center;color:#fff;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.8);pointer-events:none;padding-inline:16px}

.overlay{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(80% 60% at 50% 30%,rgba(20,32,74,.55),rgba(4,6,15,.92));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px)}
.card{max-width:420px;width:100%;text-align:center;display:grid;gap:14px;justify-items:center}
.logo{font-family:var(--f-led);font-size:clamp(36px,11vw,54px);line-height:.95;direction:ltr}
.logo b{color:var(--led);font-weight:400}
.logo small{display:block;font-size:.42em;color:var(--muted);margin-top:6px;letter-spacing:.2em}
.card p{margin:0;color:var(--muted);line-height:1.5}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-weight:500;display:flex;align-items:center;gap:8px}
.chip i{width:14px;height:14px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--led);box-shadow:0 0 0 2px rgba(255,194,61,.25)}
.go{background:linear-gradient(180deg,#ffd35c,#f2a91e);color:#1a1300;border-radius:18px;padding:16px 34px;font-family:var(--f-display);font-size:28px;box-shadow:0 6px 0 #a96d00,0 12px 30px rgba(242,169,30,.35)}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 #a96d00}
.final{font-family:var(--f-led);font-size:56px;color:var(--led);direction:ltr}
.stars{font-size:34px;letter-spacing:6px;direction:ltr;color:var(--led)}
.ghost{color:var(--muted);font-size:14px;padding:8px}
.modes3{display:grid;gap:10px;width:100%}
.m3{display:flex;gap:12px;align-items:center;text-align:start;background:rgba(16,24,52,.9);border:1px solid var(--line);border-radius:16px;padding:12px 14px;transition:transform .12s,border-color .12s}
.m3:hover{transform:translateY(-2px);border-color:var(--led)}
.m3 .m3i{font-size:30px;width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.06);display:grid;place-items:center;flex:none}
.m3 b{display:block;font-family:var(--f-display);font-weight:400;font-size:21px}
.m3 small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.prompt .vis.name{font-size:20px;font-family:var(--f-en);font-weight:700;letter-spacing:.04em}
.prompt .vis.letter{font-family:var(--f-en);font-weight:700;color:var(--led);font-size:46px}
.flashmsg{position:fixed;left:0;right:0;top:46%;text-align:center;font-family:var(--f-display);font-size:26px;color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.8);pointer-events:none}
.hello{color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:22px}
.perf{font-size:13px;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.fps{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);inset-inline-end:max(16px,env(safe-area-inset-right,0px));font:12px/1 monospace;background:rgba(0,0,0,.7);color:#3ee07f;padding:5px 8px;border-radius:6px;direction:ltr;z-index:9}
.loading{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="c" aria-label="אצטדיון: בעט לתשובה הנכונה"></canvas>

<div class="hud-top" id="hud" hidden>
  <div class="board">
    <div class="side"><i id="tcol"></i><span id="tname"></span></div>
    <div class="score" id="score">0 - 0</div>
    <div class="side"><span id="oname">השוער</span><i id="ocol" style="background:#f4d419"></i></div>
  </div>

<div class="overlay" id="start">
  <div class="card">
    <div class="logo">ENGLISH <b>KICK</b><small>3D STADIUM</small></div>
    <p><b class="hello">ברוך הבא לאצטדיון, אורחי!</b><br>בחר משחק:</p>

      <button class="m3" data-mode="keeper"><span class="m3i">🧤</span><span><b>השוער</b><small>אתה בשער: עוצרים רק כדורים עם האות הנכונה</small></span></button>
      <button class="m3" data-mode="pass"><span class="m3i">⭐</span><span><b>מסירות לכוכבים</b><small>מוסרים לשחקן לפי האות בשם שלו, ומסיימים בגול</small></span></button>
    </div>

</div>
<div class="overlay" id="end" hidden>
  <div class="card">
    <div class="logo" id="endTitle"></div>
    <div class="final" id="endScore"></div>

    <button class="ghost" id="menu">למשחקים אחרים באצטדיון</button>
    <a class="ghost" href="./">חזרה למשחק הראשי</a>
  </div>
</div>

<script src="content.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);

if(!window.THREE){ $("#loading").textContent="לא הצלחתי לטעון את מנוע התלת־ממד. נסה לרענן את הדף."; return; }
const T=THREE;

/* ---------- content (shared with the main game, see content.js) ---------- */
const EKP=EK.P, NST=EK.STAGES.length, LETTERS=EK.LETTERS, STARS=EK.STARS;
const curStage=()=>Math.min(EKP.unlocked||1,NST);
function makeRound(){ const n=curStage(); return EK.STAGES[n-1].make().slice(0,5).map(q=>({...q,stage:n})); }

/* ---------- team ---------- */
const TEAMS={barca:{name:"ברצלונה",k1:"#1f53d6",k2:"#a50044",crowd:["#1f53d6","#a50044","#a50044","#1f53d6","#ffd34d","#ffffff","#1a2550"]},
             maccabi:{name:"מכבי חיפה",k1:"#0b8f3e",k2:"#0a7a35",crowd:["#0b8f3e","#0b8f3e","#ffffff","#0a7a35","#ffffff","#1a2550","#0b8f3e"]}};
let team=TEAMS[EKP.team]?EKP.team:"barca";

/* ---------- audio ---------- */
let voice=null, muted=false;
function loadVoice(){ try{ const vs=speechSynthesis.getVoices(); voice=vs.find(v=>/en-US/i.test(v.lang)&&/female|samantha|google us/i.test(v.name))||vs.find(v=>/^en/i.test(v.lang))||null; }catch(e){} }
try{ loadVoice(); speechSynthesis.onvoiceschanged=loadVoice; }catch(e){}
function say(t){ if(muted||!t) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=.78; if(voice) u.voice=voice; speechSynthesis.speak(u);}catch(e){} }
let ac=null, ambGain=null;
function actx(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ac; }
function noiseBuf(sec){ const a=actx(), b=a.createBuffer(1,a.sampleRate*sec,a.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }
function burst(freq,q,peak,att,dec){ const a=actx(); if(!a) return; const s=a.createBufferSource(); s.buffer=noiseBuf(att+dec+.1); const f=a.createBiquadFilter(); f.type="bandpass"; f.frequency.value=freq; f.Q.value=q; const g=a.createGain(), t=a.currentTime; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+att); g.gain.exponentialRampToValueAtTime(.001,t+att+dec); s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); }
function whistle(){ const a=actx(); if(!a) return; const o=a.createOscillator(), g=a.createGain(), l=a.createOscillator(), lg=a.createGain(); o.frequency.value=2300; l.frequency.value=28; lg.gain.value=180; l.connect(lg); lg.connect(o.frequency); o.connect(g); g.connect(a.destination); const t=a.currentTime; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.1,t+.02); g.gain.setValueAtTime(.1,t+.3); g.gain.linearRampToValueAtTime(0,t+.4); o.start(t); l.start(t); o.stop(t+.45); l.stop(t+.45); }
function thump(){ const a=actx(); if(!a) return; const o=a.createOscillator(), g=a.createGain(), t=a.currentTime; o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(50,t+.15); g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.001,t+.2); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+.22); }
function ambience(){ const a=actx(); if(!a||ambGain) return; const s=a.createBufferSource(); s.buffer=noiseBuf(3); s.loop=true; const f=a.createBiquadFilter(); f.type="bandpass"; f.frequency.value=420; f.Q.value=.5; ambGain=a.createGain(); ambGain.gain.value=.05; s.connect(f); f.connect(ambGain); ambGain.connect(a.destination); s.start(); }
function swell(to,sec){ if(!ambGain||!ac) return; const t=ac.currentTime; ambGain.gain.cancelScheduledValues(t); ambGain.gain.setValueAtTime(ambGain.gain.value,t); ambGain.gain.linearRampToValueAtTime(to,t+sec); }

/* ---------- renderer & scene ---------- */
const canvas=$("#c");
const renderer=new T.WebGLRenderer({canvas,antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(1.75,window.devicePixelRatio||1));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap;
renderer.outputEncoding=T.sRGBEncoding; renderer.toneMapping=T.ACESFilmicToneMapping; renderer.toneMappingExposure=1.08;
const scene=new T.Scene();
scene.background=new T.Color(0x060a1a); scene.fog=new T.Fog(0x060a1a,48,125);
const camera=new T.PerspectiveCamera(55,1,.1,300);
const CAM={pos:new T.Vector3(.6,3.6,14.9), look:new T.Vector3(0,1.15,0)};
const SIDE={pos:new T.Vector3(7.8,1.35,3.2), look:new T.Vector3(-.3,1.2,-.6)};
const camPos=CAM.pos.clone(), camLook=CAM.look.clone();
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h;
  if(camera.aspect<1){ CAM.pos.set(.6,3.6,14.9); const hf=42*Math.PI/180; camera.fov=clamp(2*Math.atan(Math.tan(hf/2)/camera.aspect)*180/Math.PI,50,80); }
  else { CAM.pos.set(.6,3.4,16.5); camera.fov=50; }
  camera.updateProjectionMatrix(); }
addEventListener("resize",resize); resize();

scene.add(new T.HemisphereLight(0xbcd0ff,0x1d4a24,.62));
const sun=new T.DirectionalLight(0xfff4dc,1.15); sun.position.set(10,22,20); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:70}); sun.shadow.bias=-.0006;
sun.target.position.set(0,0,5); scene.add(sun,sun.target);
const fill=new T.DirectionalLight(0x9fb4ff,.4); fill.position.set(-12,15,-10); scene.add(fill);

function canvasTex(c){ const t=new T.CanvasTexture(c); t.encoding=T.sRGBEncoding; t.anisotropy=renderer.capabilities.getMaxAnisotropy(); return t; }

/* grass with real pitch markings (units: metres; goal line z=0, spot z=11) */
function grassTex(){
  const W=1024,H=1316,c=document.createElement("canvas"); c.width=W; c.height=H; const g=c.getContext("2d");
  const px=x=>(x+35)/70*W, pz=z=>(z+33)/90*H, s=W/70;
  for(let z=-33;z<57;z+=5){ g.fillStyle=(Math.floor((z+33)/5)%2)?"#2c8c42":"#25793a"; g.fillRect(0,pz(z),W,pz(z+5)-pz(z)+1); }
  for(let i=0;i<14000;i++){ g.fillStyle=`rgba(${Math.random()<.5?"0,0,0":"255,255,255"},${Math.random()*.07})`; g.fillRect(Math.random()*W,Math.random()*H,2,2); }
  g.strokeStyle="rgba(240,248,240,.92)"; g.lineWidth=3.4; g.lineCap="round";
  const L=(a,b,c2,d)=>{ g.beginPath(); g.moveTo(px(a),pz(b)); g.lineTo(px(c2),pz(d)); g.stroke(); };
  L(-35,0,35,0); L(-20.16,0,-20.16,16.5); L(20.16,0,20.16,16.5); L(-20.16,16.5,20.16,16.5);
  L(-9.16,0,-9.16,5.5); L(9.16,0,9.16,5.5); L(-9.16,5.5,9.16,5.5);
  const a=Math.acos(5.5/9.15); g.beginPath(); g.arc(px(0),pz(11),9.15*s,Math.PI/2-a,Math.PI/2+a); g.stroke();
  return canvasTex(c);
}
const ground=new T.Mesh(new T.PlaneGeometry(70,90),new T.MeshStandardMaterial({map:grassTex(),roughness:.95}));
ground.rotation.x=-Math.PI/2; ground.position.set(0,0,12); ground.receiveShadow=true; scene.add(ground);
const spotMesh=new T.Mesh(new T.CircleGeometry(.12,20),new T.MeshStandardMaterial({color:0xf0f8f0,roughness:.9})); spotMesh.rotation.x=-Math.PI/2; spotMesh.position.set(0,.006,11); scene.add(spotMesh);
const outer=new T.Mesh(new T.PlaneGeometry(300,300),new T.MeshStandardMaterial({color:0x0b1a12,roughness:1}));
outer.rotation.x=-Math.PI/2; outer.position.y=-.02; scene.add(outer);

/* goal frame + net */
const white=new T.MeshStandardMaterial({color:0xffffff,roughness:.35,metalness:.1});

function updateNet(age){
  const a=backGeo.attributes.position.array;

  const amp=.75*Math.exp(-age*3.2)*Math.cos(age*13);
  for(let i=0;i<a.length;i+=3){ const dx=backBase[i]-netHit.x, dy=backBase[i+1]-netHit.y; a[i+2]=backBase[i+2]-amp*Math.exp(-(dx*dx+dy*dy)/.55); }
  backGeo.attributes.position.needsUpdate=true;
}

  g.fillStyle="#f7f8fb"; g.fillRect(0,0,W,H);
  const p=(1+Math.sqrt(5))/2, V=[[0,1,p],[0,-1,p],[0,1,-p],[0,-1,-p],[1,p,0],[-1,p,0],[1,-p,0],[-1,-p,0],[p,0,1],[-p,0,1],[p,0,-1],[-p,0,-1]];
  g.fillStyle="#141a2c";
  V.forEach(([x,y,z])=>{ const l=Math.hypot(x,y,z), lat=Math.asin(y/l), lon=Math.atan2(x,z); const cx=(lon/(2*Math.PI)+.5)*W, cy=(.5-lat/Math.PI)*H, r=22;
    for(const off of [-W,0,W]){ g.save(); g.translate(cx+off,cy); g.scale(1/Math.max(.25,Math.cos(lat)),1); g.beginPath(); for(let k=0;k<5;k++){ const a=k*1.2566-1.5708; g.lineTo(r*Math.cos(a),r*Math.sin(a)); } g.closePath(); g.fill(); g.restore(); } });

/* ---------- game state ---------- */
let round=[], qi=0, goals=0, saves=0, log=[], Q=null;
let phase="intro", tau=0, shot=null, resolved=false, replayDone=false, shakeUntil=0, autoNext=null;
const DUR=.62;

function hud(){

  $("#dots").innerHTML=round.map((_,k)=>`<i class="${log[k]===true?"g":log[k]===false?"s":k===qi?"now":""}"></i>`).join("");

function startGame(){
  $("#hint").textContent="בעט: הקש על התשובה הנכונה בתוך השער";
  round=makeRound(); qi=0; goals=0; saves=0; log=[];
  nextQ();
}
function nextQ(){
  clearTimeout(autoNext);
  if(qi>=round.length) return endGame();
  Q=round[qi]; hud();
  $("#pvis").textContent=Q.vis; $("#pvis").className="vis"+(Q.visName?" name":Q.visEn?" letter":""); $("#pask").textContent=Q.ask;
  $("#psub").innerHTML=Q.sub||"";
  const sp=$("#speak"); sp.hidden=!Q.speak; sp.classList.remove("pulse"); void sp.offsetWidth; if(Q.speak){ sp.classList.add("pulse"); setTimeout(()=>say(Q.speak),300); }
  panels.forEach((m,k)=>{ m.userData.state=null; setPanel(k,"idle"); m.visible=true; });
  $("#bar").hidden=true; $("#big").className="big"; $("#replay").hidden=true; $("#hint").hidden=false;
  shot=null; tau=-.5; resolved=false; replayDone=false; netHit=null; updateNet(99);
  phase="aim"; swell(.05,.6);
}
function pick(k){
  if(phase!=="aim") return;
  const ok=Q.options[k]===Q.answer, side=k===0?-1:k===2?1:0;
  const dir= ok ? (side===0?(Math.random()<.5?-1:1):-side) : side;
  const tgt= ok ? new T.Vector3(PX[k]*.92, 1.55+Math.random()*.25, -.15) : new T.Vector3(side*2.2, side===0?1.45:1.5, -.05);
  const mid=SPOT.clone().lerp(tgt,.5); mid.y+=ok?1.05:.85; mid.x+=(Math.random()-.5)*1.2;
  shot={k,ok,side,dir,tgt,mid,net:new T.Vector3(tgt.x,tgt.y-.25,zb(tgt.y-.25)+.1),kx:keeper.g.position.x};
  netHit= ok ? {x:shot.net.x,y:shot.net.y} : null;
  phase="shot"; tau=-.5; resolved=false;
  $("#hint").hidden=true; panels.forEach((m,i)=>setPanel(i,i===k?"hover":"idle"));
  swell(.09,.5);
}

/* the whole shot is a pure function of tau (seconds since contact), so the replay can re-run it slowly */
const bez=(a,b,c,t)=>new T.Vector3((1-t)*(1-t)*a.x+2*(1-t)*t*b.x+t*t*c.x,(1-t)*(1-t)*a.y+2*(1-t)*t*b.y+t*t*c.y,(1-t)*(1-t)*a.z+2*(1-t)*t*b.z+t*t*c.z);
function applyShot(tt){
  const s=shot;
  // striker
  if(tt<0){ const p=clamp((tt+.5)/.5); striker.g.position.lerpVectors(S_START,S_KICK,easeOut(p)); const sw=Math.sin(p*Math.PI*5)*.9;
    striker.legL.rotation.x=sw; striker.legR.rotation.x=-sw; striker.armL.rotation.x=-sw*.7; striker.armR.rotation.x=sw*.7; }
  else { striker.g.position.copy(S_KICK); const k=clamp(tt/.22); striker.legR.rotation.x= k<.5 ? lerp(.6,-1.5,k*2) : lerp(-1.5,-.2,(k-.5)*2); striker.legL.rotation.x=.1;
    const cel=s.ok&&tt>.8; striker.armL.rotation.set(cel?Math.PI:-.3,0,cel?-.3:-.2); striker.armR.rotation.set(cel?Math.PI:.3,0,cel?.3:.2);
    striker.g.position.y= cel ? Math.abs(Math.sin((tt-.8)*9))*.18 : 0; }
  striker.g.rotation.y=sFace+Math.PI*0;
  // ball
  if(tt<0){ ball.position.copy(SPOT); }
  else if(tt<=DUR){ ball.position.copy(bez(SPOT,s.mid,s.tgt,easeOut(tt/DUR)*.25+tt/DUR*.75)); ball.rotation.x=-tt*28; ball.rotation.y=tt*9; }
  else if(s.ok){ const u=tt-DUR;
    if(u<.16){ ball.position.lerpVectors(s.tgt,s.net,u/.16); }
    else { const w=u-.16; ball.position.set(s.net.x, Math.max(BR, s.net.y-4.9*w*w), s.net.z+Math.min(.7,w*.9)); }
    ball.rotation.x=-tt*12; }
  else { const u=tt-DUR, v=new T.Vector3(-s.side*1.8+(s.side===0?(Math.random()*0):0), 2.4, 5.8);
    ball.position.set(s.tgt.x+v.x*u, Math.max(BR, s.tgt.y+v.y*u-4.9*u*u), s.tgt.z+v.z*u); ball.rotation.x=tt*14; }
  // keeper
  const kt=tt-.08, K=keeper;

function keeperFrame(dt){

function passFrame(dt){

});
canvas.addEventListener("pointermove",e=>{
  if(phase!=="aim"||e.pointerType!=="mouse") return; const k=hitPanel(e); canvas.style.cursor=k>=0?"pointer":"default"; panels.forEach((m,i)=>setPanel(i,i===k?"hover":"idle"));
});
addEventListener("keydown",e=>{ if(phase==="aim"&&["1","2","3"].includes(e.key)) pick(+e.key-1); });
$("#speak").onclick=()=>{ if(GAME==="keeper") return say(KG.target+"."); if(GAME==="pass") return say(PG.target.star[1]); if(Q&&Q.speak) say(Q.speak); };
let GAME="penalty";
function launch(m){ GAME=m; setMode(m); actx(); ambience(); whistle(); $("#start").hidden=true; $("#end").hidden=true; $("#hud").hidden=false;
  document.body.dataset.team=team; $("#tname").textContent="אורחי"; $("#tcol").style.background=`linear-gradient(90deg,${TEAMS[team].k1} 50%,${TEAMS[team].k2} 50%)`;
  if(m==="penalty") startGame(); else if(m==="keeper") startKeeper(); else startPass(); }
document.querySelectorAll(".m3").forEach(b=>b.onclick=()=>launch(b.dataset.mode));
$("#again").onclick=()=>launch(GAME);
$("#menu").onclick=()=>{ phase="intro"; setMode("intro"); $("#end").hidden=true; $("#start").hidden=false; $("#penSub").textContent=`שאלות ממחזור ${curStage()}: ${EK.STAGES[curStage()-1].t}`; };
$("#penSub").textContent=`שאלות ממחזור ${curStage()}: ${EK.STAGES[curStage()-1].t}`;
function chips(){ $("#chips").innerHTML=Object.entries(TEAMS).map(([k,v])=>`<button class="chip" data-t="${k}" aria-pressed="${team===k}"><i style="background:linear-gradient(90deg,${v.k1} 50%,${v.k2} 50%)"></i>${v.name}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ team=b.dataset.t; EKP.team=team; EK.save(); striker.kitMat.map.dispose(); striker.kitMat.map=stripeTex(); striker.kitMat.needsUpdate=true; mates.forEach(m=>{ m.kitMat.map=stripeTex(); m.kitMat.needsUpdate=true; }); banner.material.map.dispose(); banner.material.map=bannerTex(); banner.material.needsUpdate=true; colorCrowd(); chips(); }); }
chips();

/* ---------- performance: measure in play, drop to a lighter mode on slow phones ---------- */
const perf={n:0,sum:0,win:[],low:false};
const showFps=location.hash==="#fps"; if(showFps) $("#fps").hidden=false;
let fpsShown=0;
function trackPerf(dt){
  if(phase==="intro"||phase==="end") return;
  perf.n++; perf.sum+=dt; perf.win.push(dt); if(perf.win.length>90) perf.win.shift();
  if(!perf.low&&perf.win.length>=90){ const f=90/perf.win.reduce((a,b)=>a+b,0); if(f<36) lowMode(); }
  if(showFps&&(fpsShown++%15===0)){ const f=perf.win.length/perf.win.reduce((a,b)=>a+b,0); $("#fps").textContent=`${Math.round(f)} FPS${perf.low?" · LOW":""}`; }
}
function lowMode(){ perf.low=true; perf.win=[]; renderer.setPixelRatio(1); resize(); sun.castShadow=false; bodies.count=heads.count=BEHIND; }

/* ---------- loop ---------- */
let clockT=0, last=performance.now();
const tmpV=new T.Vector3();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; clockT+=dt; trackPerf(dt);
  adMat.map.offset.x=(adMat.map.offset.x+dt*.03)%1;
  // crowd
  const amp=clamp((cheerUntil-clockT)/.6); if(amp>0||bodies.userData.moving){ placeCrowd(clockT,amp); bodies.userData.moving=amp>0; }
  updateConfetti(dt);
  panels.forEach((m,k)=>{ m.position.y=PY+Math.sin(clockT*2+k)*.03; });

  let wantPos=CAM.pos, wantLook=CAM.look, camK=2.5;
  if(phase==="intro"||phase==="end"){
    const a=clockT*.12; tmpV.set(Math.sin(a)*14,5.5,6+Math.cos(a)*12); wantPos=tmpV; wantLook=new T.Vector3(0,1,2); camK=1.2;
    if(GAME==="penalty"||!$("#start").hidden){ striker.g.position.copy(S_START); striker.g.rotation.y=sFace; ball.position.copy(SPOT); }
    keeper.g.position.set(Math.sin(clockT*1.8)*.3,0,-.35); keeper.g.rotation.z=0;
  } else if(phase==="aim"){
    keeper.g.position.set(Math.sin(clockT*1.8)*.32,0,-.35); keeper.g.rotation.z=0; keeper.body.position.y=Math.abs(Math.sin(clockT*3.6))*.04;
    keeper.armL.rotation.z=-.75+Math.sin(clockT*3.6)*.06; keeper.armR.rotation.z=.75-Math.sin(clockT*3.6)*.06;
    striker.g.position.copy(S_START); striker.g.rotation.y=sFace; striker.legL.rotation.x=striker.legR.rotation.x=0; striker.armL.rotation.set(0,0,-.15); striker.armR.rotation.set(0,0,.15); striker.g.position.y=0;
    ball.position.copy(SPOT);
  } else if(phase==="shot"){
    tau+=dt; if(tau>=0&&tau-dt<0) thump();
    applyShot(tau);
    if(!resolved&&tau>=DUR+(shot.ok?.12:0)) resolve();
    if(tau>0){ wantPos=new T.Vector3(CAM.pos.x+shot.tgt.x*.12,CAM.pos.y-.2,CAM.pos.z-.6); wantLook=new T.Vector3(shot.tgt.x*.3,1.2,0); camK=2.2; }
    if(tau>1.75){
      if(shot.ok){ phase="replay"; tau=-.18; replayDone=false; $("#replay").hidden=false; cheerUntil=Math.max(cheerUntil,clockT+1); }
      else { phase="result"; }
    }
  } else if(phase==="replay"){
    tau+=dt*.32; applyShot(tau);
    wantPos=SIDE.pos; wantLook=new T.Vector3(lerp(SIDE.look.x,shot.tgt.x*.5,.5),SIDE.look.y,SIDE.look.z); camK=6;
    if(tau>1.35||replayDone){ phase="result"; $("#replay").hidden=true; applyShot(1.6); autoNext=setTimeout(()=>{ if(phase==="result") advance(); },2600); }
  } else if(phase==="play"){
    const c=GAME==="keeper"?keeperFrame(dt):passFrame(dt); wantPos=c.pos; wantLook=c.look; camK=c.k;
  } else if(phase==="result"){
    applyShot(Math.min(tau+=dt,2.4)); wantPos=new T.Vector3(CAM.pos.x+shot.tgt.x*.1,CAM.pos.y-.1,CAM.pos.z-.3); wantLook=new T.Vector3(shot.tgt.x*.2,1.15,0); camK=1.5;
  }
  if(phase==="replay"&&tau<-.1){ camPos.copy(SIDE.pos); camLook.copy(SIDE.look); }
  camPos.lerp(wantPos,1-Math.exp(-camK*dt)); camLook.lerp(wantLook,1-Math.exp(-camK*dt));
  camera.position.copy(camPos);
  if(clockT<shakeUntil){ const k=(shakeUntil-clockT)/.45; camera.position.x+=(Math.random()-.5)*.18*k; camera.position.y+=(Math.random()-.5)*.12*k; }
  camera.lookAt(camLook);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
setMode("intro");
window.__ek3d={PG,KG,mates,camera,T};
requestAnimationFrame(frame);
$("#loading").hidden=true;
try{ document.fonts.ready.then(()=>{ adMat.map=boardTex(); adMat.map.repeat.set(1.6,1); adMat.needsUpdate=true; }); }catch(e){}
})();
</script>
</body></html>
