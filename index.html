<!doctype html><html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1024"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-512.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="English Kick"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>English Kick</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Bungee&family=Rubik:wght@400;500;700&family=Secular+One&display=swap">
<style>
/* Layout: one-screen night-stadium app. Home = season fixtures list; Match = LED scoreboard + floodlit pitch where the answers sit inside the goal. */
:root{
  color-scheme: dark;
  --night:#0a1024; --night2:#131d3d; --panel:#18234a; --panel-line:#2a3a6e;
  --turf:#1b6e35; --turf2:#20803d; --chalk:#eaf3ec;
  --led:#ffc23d; --ink:#f2f5fc; --muted:#a3aecb;
  --good:#3ee07f; --bad:#ff5a5f;
  --team:#1f53d6; --team-2:#a50044; --team-ink:#ffffff;
  --keeper:#f4d419;
  --f-display:"Secular One","Rubik",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,sans-serif;
  --f-en:"Andika","Rubik",system-ui,sans-serif;
  --f-led:"Bungee","Rubik",system-ui,sans-serif;
}
body[data-team="maccabi"]{ --team:#0b8f3e; --team-2:#e9f7ee; --team-ink:#ffffff; }
html,body{height:100%}
body{background:radial-gradient(120% 60% at 15% -10%,#24366e 0%,transparent 55%),radial-gradient(120% 60% at 85% -10%,#24366e 0%,transparent 55%),var(--night);color:var(--ink);font-family:var(--f-body);font-size:16px}
#app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--led);outline-offset:3px}
.en{direction:ltr;unicode-bidi:isolate;font-family:var(--f-en)}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--f-led);font-size:clamp(22px,6vw,30px);letter-spacing:.02em;line-height:1;direction:ltr}
.brand b{color:var(--led);font-weight:400}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--panel);border:1px solid var(--panel-line);display:grid;place-items:center;font-size:20px}

/* home */
.hero{background:linear-gradient(135deg,var(--team) 0 50%,var(--team-2) 50% 100%);border-radius:20px;padding:3px}
.hero-in{background:linear-gradient(180deg,rgba(10,16,36,.86),rgba(10,16,36,.96));border-radius:17px;padding:18px;display:grid;gap:12px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,6.4vw,34px);margin:0;line-height:1.15;text-wrap:balance}
.hero p{margin:0;color:var(--muted);line-height:1.5}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--night);border:1px solid var(--panel-line);border-radius:12px;padding:8px 12px;display:flex;gap:8px;align-items:baseline}
.stat .n{font-family:var(--f-led);color:var(--led);font-size:20px;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:13px}
.teampick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.teampick span{color:var(--muted);font-size:14px}
.chip{border-radius:999px;padding:7px 14px;background:var(--night);border:1px solid var(--panel-line);font-weight:500;display:flex;align-items:center;gap:8px}
.chip i{width:14px;height:14px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--led);box-shadow:0 0 0 2px rgba(255,194,61,.25)}
.sec-title{font-family:var(--f-display);font-size:20px;margin:6px 2px 0}
.fixtures{display:grid;gap:10px}
.fx{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;text-align:start;background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;padding:12px 14px;transition:transform .15s}
.fx:not([disabled]):hover{transform:translateY(-2px);border-color:var(--team)}
.fx[disabled]{opacity:.5;cursor:not-allowed}
.fx .round{font-family:var(--f-led);font-size:13px;line-height:1.1;text-align:center;color:var(--led);background:var(--night);border-radius:10px;padding:8px 4px}
.fx .round small{display:block;font-size:20px}
.fx .t{font-weight:700;font-size:17px}
.fx .s{color:var(--muted);font-size:14px;margin-top:2px}
.fx .stars{font-size:18px;letter-spacing:2px;direction:ltr;white-space:nowrap}
.fx.current{border-color:var(--led)}
.tip{color:var(--muted);font-size:13px;line-height:1.5;margin:0 2px}

/* match */
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:#05080f;border:2px solid #1d2747;border-radius:14px;padding:10px 12px}
.board .side{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;min-width:0}
.board .side:last-child{justify-content:flex-end}
.board .side i{width:12px;height:12px;border-radius:3px;flex:none}
.board .score{font-family:var(--f-led);font-size:30px;color:var(--led);direction:ltr;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(255,194,61,.5)}
.shots{display:flex;gap:5px;justify-content:center;direction:ltr}
.shots i{width:16px;height:16px;border-radius:50%;background:#26304f;display:block}
.shots i.g{background:var(--good)} .shots i.s{background:var(--bad)} .shots i.now{outline:2px solid var(--led);outline-offset:1px}

.prompt{background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;min-height:92px}
.prompt .vis{font-size:52px;line-height:1;min-width:64px;text-align:center}
.prompt .vis.big-en{font-family:var(--f-en);font-weight:700;font-size:60px;color:var(--led)}
.prompt .ask{font-weight:700;font-size:17px;line-height:1.35}
.prompt .sub{color:var(--muted);font-size:14px;margin-top:4px}
.prompt .sub .en{font-size:22px;color:var(--ink)}
.speak{width:56px;height:56px;border-radius:50%;background:var(--team);color:var(--team-ink);font-size:24px;display:grid;place-items:center;box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.speak.pulse{animation:pulse 1s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,194,61,.7)}100%{box-shadow:0 0 0 18px rgba(255,194,61,0)}}

.pitch{position:relative;border-radius:18px;overflow:hidden;height:min(400px,62vh);min-height:330px;background:repeating-linear-gradient(180deg,var(--turf) 0 44px,var(--turf2) 44px 88px);box-shadow:inset 0 30px 60px rgba(0,0,0,.35)}
.pitch::before{content:"";position:absolute;left:6%;right:6%;top:0;height:62%;border:3px solid rgba(234,243,236,.75);border-top:0}
.pitch::after{content:"";position:absolute;left:50%;bottom:58px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--chalk)}
.goal{direction:ltr;position:absolute;left:9%;right:9%;top:14px;height:58%;border:7px solid #f7f9fb;border-bottom:0;border-radius:6px 6px 0 0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 2px,transparent 2px 14px),repeating-linear-gradient(-45deg,rgba(255,255,255,.14) 0 2px,transparent 2px 14px),rgba(5,10,20,.35);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.targets{position:absolute;inset:10px 10px auto 10px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;z-index:3}
.target{min-height:70px;border-radius:14px;background:rgba(255,255,255,.94);color:#0c1430;font-family:var(--f-en);font-weight:700;font-size:clamp(20px,5.6vw,30px);padding:8px 4px;display:grid;place-items:center;line-height:1.1;box-shadow:0 4px 0 rgba(0,0,0,.3);transition:transform .12s,background .2s;word-break:break-word}
.target:hover:not([disabled]){transform:translateY(-3px) scale(1.03)}
.target[disabled]{cursor:default}
.target.right{background:var(--good);color:#05210f}
.target.wrong{background:var(--bad);color:#fff}
.target.dim{opacity:.45}

.keeper{position:absolute;left:50%;bottom:0;width:58px;height:96px;margin-left:-29px;z-index:2;transition:transform .35s cubic-bezier(.2,.8,.3,1);transform-origin:50% 90%}
.keeper .head{position:absolute;left:17px;top:0;width:24px;height:24px;border-radius:50%;background:#e8b98f}
.keeper .body{position:absolute;left:9px;top:22px;width:40px;height:44px;border-radius:12px 12px 6px 6px;background:var(--keeper)}
.keeper .legs{position:absolute;left:13px;top:64px;width:32px;height:32px;background:linear-gradient(90deg,#111a33 0 12px,transparent 12px 20px,#111a33 20px)}
.keeper .glove{position:absolute;top:26px;width:16px;height:16px;border-radius:6px;background:#fff;border:2px solid #222}
.keeper .glove.l{left:-6px} .keeper .glove.r{right:-6px}
.keeper.idle{animation:sway 1.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
.keeper.dive-0{transform:translate(-210%,-55%) rotate(-75deg)}
.keeper.dive-1{transform:translateY(-70%)}
.keeper.dive-2{transform:translate(210%,-55%) rotate(75deg)}

.ball{position:absolute;left:50%;bottom:30px;width:46px;height:46px;margin-left:-23px;font-size:44px;line-height:46px;text-align:center;z-index:4;transition:transform .5s cubic-bezier(.25,.7,.3,1);filter:drop-shadow(0 6px 4px rgba(0,0,0,.4))}
.ball.ready{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.flash{position:absolute;inset:0;display:grid;place-items:center;z-index:6;pointer-events:none}
.flash .box{background:rgba(5,8,15,.86);border:2px solid var(--led);border-radius:18px;padding:14px 20px;text-align:center;transform:scale(.6);opacity:0;transition:transform .25s cubic-bezier(.2,1.4,.4,1),opacity .2s;max-width:88%;pointer-events:auto}
.flash.show .box{transform:scale(1);opacity:1}
.flash .big{font-family:var(--f-led);font-size:clamp(34px,10vw,52px);line-height:1;direction:ltr}
.flash .big.g{color:var(--good)} .flash .big.s{color:var(--bad)}
.flash .heb{font-family:var(--f-display);font-size:20px;margin-top:6px}
.flash .ans{margin-top:8px;color:var(--muted);font-size:15px}
.flash .ans .en{color:var(--ink);font-size:24px;font-weight:700}
.flash .next{margin-top:12px;background:var(--team);color:var(--team-ink);border-radius:12px;padding:10px 20px;font-weight:700;font-size:16px}

.matchfoot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ghost{color:var(--muted);font-size:14px;padding:8px 4px}

/* result */
.result{background:var(--panel);border:1px solid var(--panel-line);border-radius:20px;padding:24px 18px;text-align:center;display:grid;gap:12px;justify-items:center}
.result .trophy{font-size:72px;line-height:1}
.result h2{font-family:var(--f-display);font-weight:400;font-size:32px;margin:0}
.result .final{font-family:var(--f-led);color:var(--led);font-size:44px;direction:ltr}
.result .stars{font-size:34px;letter-spacing:6px;direction:ltr}
.result p{margin:0;color:var(--muted);line-height:1.5;max-width:44ch}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cta{background:var(--team);color:var(--team-ink);border-radius:14px;padding:13px 22px;font-weight:700;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.cta.alt{background:var(--night);border:1px solid var(--panel-line);color:var(--ink);box-shadow:none}
.review{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.review button{background:var(--night);border:1px solid var(--panel-line);border-radius:10px;padding:6px 10px;font-size:18px}

/* letter drills */
.drills{display:grid;gap:10px}
.drill{display:grid;grid-template-columns:56px 1fr;gap:12px;background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;padding:12px 14px;align-items:start}
.dicon{font-size:30px;width:56px;height:56px;border-radius:14px;background:var(--night);display:grid;place-items:center}
.drill .t{font-weight:700;font-size:17px}
.drill .s{color:var(--muted);font-size:14px;margin-top:2px}
.lvls{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.lvl{flex:1 1 0;min-width:84px;background:var(--night);border:1px solid var(--panel-line);border-radius:12px;padding:8px 6px;display:grid;gap:2px;justify-items:center}
.lvl:hover{border-color:var(--team)}
.lvl b{font-size:15px}
.lvl .st{font-size:13px;color:var(--led);direction:ltr;letter-spacing:1px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hud-t{font-family:var(--f-display);font-size:22px}
.hud-s{color:var(--muted);font-size:13px}
.hud-stats{display:flex;gap:8px;flex-wrap:wrap}
.drill-prompt{min-height:80px}
.field{position:relative;border-radius:18px;overflow:hidden;height:min(420px,60vh);min-height:340px;background:radial-gradient(circle at 50% 100%,transparent 0 58px,rgba(234,243,236,.7) 58px 61px,transparent 61px),repeating-linear-gradient(90deg,var(--turf) 0 48px,var(--turf2) 48px 96px);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.field.hitflash{animation:hitf .5s}
@keyframes hitf{0%{box-shadow:inset 0 0 0 0 var(--bad)}30%{box-shadow:inset 0 0 0 12px var(--bad)}100%{box-shadow:inset 0 0 0 0 var(--bad)}}
.minigoal{position:absolute;left:30%;right:30%;top:10px;height:46px;border:5px solid #f7f9fb;border-bottom:0;border-radius:4px 4px 0 0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 2px,transparent 2px 10px)}
.player{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:18px 18px 22px 22px;background:var(--team);border:4px solid var(--team-2);color:#fff;font-weight:700;font-size:32px;display:grid;place-items:center;text-shadow:0 2px 3px rgba(0,0,0,.5);box-shadow:0 5px 0 rgba(0,0,0,.3);transition:transform .15s,opacity .3s;z-index:2}
.player:hover:not(.done){transform:scale(1.08)}
.player.done{opacity:.4;transform:scale(.88)}
.player.hint{animation:pulse 1s ease-out infinite}
.player.shake{animation:shake .4s}
@keyframes shake{0%,100%{translate:0}25%{translate:-7px}75%{translate:7px}}
.pball{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;font-size:36px;line-height:40px;text-align:center;z-index:4;transition:left .35s cubic-bezier(.3,.7,.3,1),top .35s cubic-bezier(.3,.7,.3,1);pointer-events:none;filter:drop-shadow(0 5px 3px rgba(0,0,0,.4))}
.fball{position:absolute;top:0;width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 55%,#dfe5ef 100%);border:3px solid #1b2340;color:#0c1430;font-weight:700;font-size:34px;display:grid;place-items:center;box-shadow:0 6px 10px rgba(0,0,0,.35);will-change:transform;transition:opacity .35s,background .15s}
.fball.saved{background:var(--good);border-color:var(--good);opacity:0}
.fball.bad{background:var(--bad);color:#fff;opacity:0}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:14px;perspective:600px}
.card .back,.card .front{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .35s}
.card .back{background:var(--team);border:4px solid var(--team-2);font-size:30px}
.card .front{background:#fff;color:#0c1430;font-weight:700;font-size:clamp(30px,9vw,44px);transform:rotateY(180deg)}
.card.up .back{transform:rotateY(180deg)}
.card.up .front{transform:rotateY(0)}
.card.match .front{background:var(--good);color:#05210f}
@media (min-width:560px){.mem{grid-template-columns:repeat(5,1fr)}}

/* graphics v2: stands, floodlights, drawn kits, real ball */
:root{ --kit-1:#1f53d6; --kit-2:#a50044; }
body[data-team="maccabi"]{ --kit-1:#0b8f3e; --kit-2:#087a34; }
.stands{position:absolute;left:0;right:0;top:0;width:100%;height:56px;display:block;z-index:1}
.lights{position:absolute;inset:0;pointer-events:none;z-index:5;background:radial-gradient(55% 38% at 0% 0%,rgba(255,252,230,.2),transparent 70%),radial-gradient(55% 38% at 100% 0%,rgba(255,252,230,.2),transparent 70%),linear-gradient(180deg,transparent 65%,rgba(0,0,0,.28))}
.pitch::before{top:56px;height:52%}
.goal{top:60px;height:47%}
.goal.ripple{animation:ripple .6s ease-out}
@keyframes ripple{0%{transform:scale(1)}25%{transform:scale(1.035,.97)}55%{transform:scale(.985,1.02)}100%{transform:scale(1)}}
.keeper{width:62px;height:100px;margin-left:-31px}
.keeper svg{width:100%;height:100%;display:block;overflow:visible}
.ball,.pball{background:var(--ball) center/contain no-repeat;font-size:0;color:transparent}
.ball{transition:transform .55s cubic-bezier(.25,.7,.3,1)}
.fball{background:var(--ball-light) center/cover no-repeat,#fff;border-width:2px;font-size:36px;text-shadow:0 0 6px #fff,0 0 2px #fff}
.field .minigoal{top:62px}
.player{background:none;border:0;border-radius:0;width:74px;height:74px;margin:-37px 0 0 -37px;box-shadow:none;text-shadow:none;filter:drop-shadow(0 5px 3px rgba(0,0,0,.45))}
.player svg{position:absolute;inset:0;width:100%;height:100%}
.player .pl{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:#fff;color:#0c1430;font-size:24px;display:grid;place-items:center;line-height:1}
.card .back{background:linear-gradient(160deg,#1a2550,#0c1330);border:2px solid var(--panel-line)}
.card .back svg{width:68%;height:auto}
.score.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.herocrowd{display:block;width:100%;height:58px;border-radius:12px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* v3: club home, season path, sheet, rewards, 3D penalty */
.club{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#1a2550,#0d1430);border:1px solid var(--panel-line)}
.club .herocrowd{height:84px;border-radius:0}
.club-in{padding:14px 16px 18px;display:grid;gap:10px}
.rank{display:flex;align-items:center;gap:12px}
.rank-txt{flex:1;min-width:0}
.rk-l{color:var(--muted);font-size:13px}
.rk-n{font-family:var(--f-display);font-size:24px;line-height:1.15}
.pts{display:flex;align-items:baseline;gap:4px}
.pts b{font-family:var(--f-led);color:var(--led);font-size:26px;font-weight:400;font-variant-numeric:tabular-nums}
.pts span{color:var(--muted);font-size:13px}
.xp{height:12px;border-radius:99px;background:#0a1024;border:1px solid var(--panel-line);overflow:hidden}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--kit-1),var(--led));border-radius:99px}
.xp-l{color:var(--muted);font-size:13px}
.play{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,#ffd35c,#f2a91e);color:#1a1300;border-radius:18px;padding:14px 18px;box-shadow:0 6px 0 #a96d00,0 10px 24px rgba(242,169,30,.3);text-align:start;transition:transform .1s,box-shadow .1s;margin-top:4px}
.play:active{transform:translateY(3px);box-shadow:0 3px 0 #a96d00}
.play b{display:block;font-family:var(--f-display);font-size:30px;font-weight:400;line-height:1}
.play small{display:block;font-size:14px;opacity:.85;margin-top:4px}
.play-ic{width:54px;height:54px;border-radius:50%;background:var(--ball) center/contain no-repeat;flex:none;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.medal{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-led);font-size:15px;color:#3b2600;background:radial-gradient(circle at 35% 30%,#fff3c4,#ffc23d 45%,#c98a12);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 3px 0 #8a5c06;direction:ltr}
.medal.locked{background:#26304f;color:#56628a;box-shadow:inset 0 0 0 3px rgba(255,255,255,.05)}
.medal.big{width:56px;height:56px;font-size:20px}
.iconbtn{position:relative}

let ac=null;
function ctx(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ac; }
function whistle(){ const a=ctx(); if(!a||muted) return; const o=a.createOscillator(), g=a.createGain(), l=a.createOscillator(), lg=a.createGain(); o.frequency.value=2300; l.frequency.value=28; lg.gain.value=180; l.connect(lg); lg.connect(o.frequency); o.connect(g); g.connect(a.destination); const t=a.currentTime; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.12,t+.02); g.gain.setValueAtTime(.12,t+.35); g.gain.linearRampToValueAtTime(0,t+.45); o.start(t); l.start(t); o.stop(t+.5); l.stop(t+.5); }
function crowd(on){ const a=ctx(); if(!a||muted) return; const len=a.sampleRate*(on?1.6:.35), b=a.createBuffer(1,len,a.sampleRate), d=b.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; const s=a.createBufferSource(); s.buffer=b; const f=a.createBiquadFilter(); f.type="bandpass"; f.frequency.value=on?900:220; f.Q.value=.6; const g=a.createGain(); const t=a.currentTime; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(on?.35:.4,t+(on?.25:.02)); g.gain.exponentialRampToValueAtTime(.001,t+(on?1.6:.35)); s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); }

/* ---------- intro music: an original stadium tune, generated live (no audio files) ---------- */
let VIEW="home";
const MUS={on:false,timer:null,next:0,step:0,master:null};
const EIGHTH=60/126/2;
const MEL=[67,67,72,72,71,69,67,0, 64,67,69,67,64,62,60,0, 67,67,72,72,74,72,71,69, 67,0,72,0,67,0,0,0];
const BASS=[48,48,43,43,45,45,41,43];
const mtof=m=>440*Math.pow(2,(m-69)/12);
let NB=null; function nbuf(){ if(!NB){ NB=ac.createBuffer(1,ac.sampleRate,ac.sampleRate); const d=NB.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; } return NB; }
function mBrass(t,m,dur){ const f=ac.createBiquadFilter(), g=ac.createGain(); f.type="lowpass"; f.frequency.setValueAtTime(900,t); f.frequency.linearRampToValueAtTime(2600,t+.05); f.frequency.linearRampToValueAtTime(1300,t+dur);
  [-8,0,8].forEach(d=>{ const o=ac.createOscillator(); o.type="sawtooth"; o.frequency.value=mtof(m); o.detune.value=d; o.connect(f); o.start(t); o.stop(t+dur+.05); });
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.045,t+.03); g.gain.setValueAtTime(.045,t+dur*.7); g.gain.linearRampToValueAtTime(0,t+dur); f.connect(g); g.connect(MUS.master); }
function mBass(t,m,dur){ const o=ac.createOscillator(), g=ac.createGain(); o.type="triangle"; o.frequency.value=mtof(m); g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g); g.connect(MUS.master); o.start(t); o.stop(t+dur); }
function mKick(t){ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(45,t+.12); g.gain.setValueAtTime(.45,t); g.gain.exponentialRampToValueAtTime(.001,t+.18); o.connect(g); g.connect(MUS.master); o.start(t); o.stop(t+.2); }
function mNoise(t,freq,q,vol,dur){ const s=ac.createBufferSource(); s.buffer=nbuf(); const f=ac.createBiquadFilter(); f.type="bandpass"; f.frequency.value=freq; f.Q.value=q; const g=ac.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); s.connect(f); f.connect(g); g.connect(MUS.master); s.start(t,Math.random()*.5,dur+.05); }
function mSchedule(){
  while(MUS.next<ac.currentTime+.25){
    const i=MUS.step%32, t=MUS.next;
    if(i%4===0) mKick(t);
    if(i%4===2) mNoise(t,1500,.8,.22,.14);           // clap
    if(i%2===1) mNoise(t,7000,1,.05,.04);            // hi-hat
    if(i%2===0) mBass(t,BASS[Math.floor(i/4)%8],EIGHTH*1.8);
    const m=MEL[i]; if(m){ let len=1; while(i+len<32&&MEL[i+len]===0&&len<3) len++; mBrass(t,m,EIGHTH*len*.95); }
    if(i===28||i===30) mNoise(t,650,1.2,.35,.22);    // crowd "hey!"
    MUS.step++; MUS.next+=EIGHTH;
  }
}
function musicStart(){

  const a=ctx(); if(!a) return; if(a.state==="suspended") a.resume();
  MUS.master=a.createGain(); MUS.master.gain.setValueAtTime(0,a.currentTime); MUS.master.gain.linearRampToValueAtTime(.85,a.currentTime+1.2); MUS.master.connect(a.destination);
  MUS.on=true; MUS.step=0; MUS.next=a.currentTime+.08; MUS.timer=setInterval(mSchedule,60); mSchedule();
  const b=$("#music"); if(b) b.classList.add("on");
}
function musicStop(){
  if(!MUS.on) return; MUS.on=false; clearInterval(MUS.timer);
  const g=MUS.master, t=ac.currentTime; g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value,t); g.gain.linearRampToValueAtTime(0,t+.5); setTimeout(()=>{ try{g.disconnect()}catch(e){} },700);

}

function drawPath(){
  const path=$("#path"); if(!path) return;

  if(pts.length<2) return;
  const cur=Math.min(P.unlocked,STAGES.length)-1;
  const seg=(a,b)=>{ const my=(a[1]+b[1])/2; return `C ${a[0].toFixed(1)} ${my.toFixed(1)} ${b[0].toFixed(1)} ${my.toFixed(1)} ${b[0].toFixed(1)} ${b[1].toFixed(1)}`; };
  let d=`M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`, done=d;
  for(let i=1;i<pts.length;i++){ const s=seg(pts[i-1],pts[i]); d+=" "+s; if(i<=cur) done+=" "+s; }
  path.insertAdjacentHTML("afterbegin",`<svg class="pline" aria-hidden="true"><path d="${d}" fill="none" stroke="rgba(234,243,236,.28)" stroke-width="6" stroke-dasharray="2 12" stroke-linecap="round"/>${cur>0?`<path d="${done}" fill="none" style="stroke:var(--led)" stroke-width="6" stroke-linecap="round" opacity=".85"/>`:""}</svg>`);
}

/* ---------- match ---------- */
let M=null;
function startMatch(i, st=STAGES[i]){
  leaveHome("match");
  M={ i, st, n:st.n||SHOTS, test:i<0, queue:st.make(), idx:0, goals:0, saves:0, log:[], missed:[], busy:false, streak:0 };
  RB=snapshot();
  ctx(); whistle();
  const team=TEAMS[P.team||"barca"];
  app.innerHTML = topbar() + `
  <div class="board">
    <div class="side"><i style="background:linear-gradient(90deg,${team.c1} 50%,${team.c2} 50%)"></i><span>אורחי</span></div>
    <div class="score" id="score">0 - 0</div>
    <div class="side"><span>השוער</span><i style="background:var(--keeper)"></i></div>
  </div>
  <div class="shots" id="shots" aria-label="בעיטות">${Array.from({length:M.n},()=>"<i></i>").join("")}</div>
  <div class="prompt" id="prompt"></div>
  <div class="pitch" id="pitch">
    <canvas class="stands" id="stands"></canvas>
    <div class="plane"></div>
    <div class="goal" id="goal">
      <div class="targets" id="targets"></div>
      <div class="keeper idle" id="keeper">${KEEPER}</div>
    </div>
    <div class="bshadow" id="bshadow"></div>

  </div>
  <div class="matchfoot"><button class="ghost" id="quit">→ חזרה ללוח המשחקים</button><span class="ghost">${M.test?"מבדק":"מחזור "+(i+1)}: ${st.t}</span></div>`;
  bindMute();
  $("#quit").onclick=home;
  crowdView=mountCrowd($("#stands"));
  nextShot();
}

function renderShots(){
  const dots=$("#shots").children;
  for(let k=0;k<M.n;k++){ const r=M.log[k]; dots[k].className = r===true?"g":r===false?"s":(k===M.idx?"now":""); }
  $("#score").textContent = `${M.goals} - ${M.saves}`;
}

function nextShot(){
  if(M.idx>=M.n) return endMatch();
  const q=M.queue[M.idx];
  M.busy=false;
  renderShots();
  const hasAudio=!!q.speak;
  $("#prompt").innerHTML = `
    <div class="vis ${q.visEn?"big-en en":""} ${q.visName?"name":""}">${esc(q.vis)}</div>
    <div><div class="ask">${esc(q.ask)}</div>${q.sub?`<div class="sub">${q.sub}</div>`:""}</div>
    ${hasAudio?`<button class="speak pulse" id="speak" aria-label="השמע שוב">🔊</button>`:`<span></span>`}`;
  if(hasAudio){ $("#speak").onclick=()=>say(q.speak); setTimeout(()=>say(q.speak),250); }
  const T=$("#targets");
  T.innerHTML = q.options.map((o,k)=>`<button class="target ${q.he?"he":"en"}" data-k="${k}">${esc(o)}</button>`).join("");
  T.querySelectorAll(".target").forEach(b=>b.onclick=()=>shoot(+b.dataset.k, b));
  const ball=$("#ball"); ball.style.transition="none"; ball.style.transform=""; ball.classList.add("ready"); void ball.offsetWidth; ball.style.transition="";
  const sh=$("#bshadow"); sh.style.transition="none"; sh.style.transform=""; sh.style.opacity=""; void sh.offsetWidth; sh.style.transition="";
  const kp=$("#keeper"); kp.className="keeper idle";
  $("#flash").classList.remove("show");
}

function shoot(k, btn){
  if(M.busy) return; M.busy=true;
  const q=M.queue[M.idx];
  const ok = q.options[k]===q.answer;
  const all=[...$("#targets").children];
  all.forEach(b=>b.disabled=true);
  // fly ball
  const ball=$("#ball"), pitch=$("#pitch").getBoundingClientRect(), br=ball.getBoundingClientRect(), tr=btn.getBoundingClientRect();
  const dx=(tr.left+tr.width/2)-(br.left+br.width/2), dy=(tr.top+tr.height/2)-(br.top+br.height/2);
  ball.classList.remove("ready");
  // keeper: on a goal he dives the wrong way, on a miss he dives to the shot
  const kp=$("#keeper"); kp.classList.remove("idle");
  const away = k===0?2:k===2?0:(Math.random()<.5?0:2);
  const diveTo = ok ? away : k;
  const sh=$("#bshadow"), sr=sh.getBoundingClientRect(), gr=$("#goal").getBoundingClientRect();
  const sdx=(tr.left+tr.width/2)-(sr.left+sr.width/2), sdy=gr.bottom-(sr.top+sr.height/2);
  requestAnimationFrame(()=>{
    ball.style.transform=`translate(${dx}px,${ok?dy:dy+40}px) scale(.55) rotate(${ok?720:540}deg)`;
    sh.style.transform=`translate(${sdx}px,${sdy}px) scale(.4)`; sh.style.opacity=".4";
    kp.classList.add("dive-"+diveTo);
  });
  setTimeout(()=>{
    if(ok){ btn.classList.add("right"); crowd(true); M.goals++; P.goals++;
      M.streak++; if(M.streak>=3){ P.flags=P.flags||{}; P.flags.hat=true; }
      if(crowdView) crowdView.cheer();
      const pe=$("#pitch"); pe.classList.remove("shake"); void pe.offsetWidth; pe.classList.add("shake");
      { const gr2=$("#goal").getBoundingClientRect(), np=document.createElement("span"); np.className="netpop"; np.style.left=(tr.left+tr.width/2-gr2.left)+"px"; np.style.top=(tr.top+tr.height/2-gr2.top)+"px"; $("#goal").appendChild(np); setTimeout(()=>np.remove(),650); }
      confetti(tr.left+tr.width/2, tr.top+tr.height/2);
      const gl=$("#goal"); gl.classList.remove("ripple"); void gl.offsetWidth; gl.classList.add("ripple");
      const sc=$("#score"); sc.classList.remove("pop"); void sc.offsetWidth; sc.classList.add("pop"); }
    else{
      btn.classList.add("wrong"); crowd(false); M.saves++; M.streak=0;
      all.forEach(b=>{ if(b.textContent===q.answer) b.classList.add("right"); else if(b!==btn) b.classList.add("dim"); });
      M.missed.push(q);
      // bring this item back later in the match (spaced retry)
      const back=M.idx+3;
      if(back<M.n){ M.queue.splice(back,0,{...q, options:shuffle(q.options)}); M.queue.length=Math.max(M.n,M.queue.length); }
    }
    M.log[M.idx]=ok; if(q.word){ P.tw=P.tw||{}; P.tw[q.word]=ok?(P.tw[q.word]||0)+1:0; } EK.recordItem(Math.max(0,M.i+1),q.key,ok);
    renderShots();
    showFlash(ok,q);
    setTimeout(()=>say(q.say),ok?350:500);
  },520);
}

const GOOD=["גול של אורחי!","איזו בעיטה!","ישר לחיבורים!","אורחי מבקיע!","הקהל משתגע!","מושלם!"];
const BAD=["השוער עצר!","כמעט!","בפעם הבאה נכנס!"];
function showFlash(ok,q){
  const show = q.show || q.answer;
  const heb = q.heb ? `<div class="ans">${esc(q.heb)}</div>` : "";
  $("#flashbox").innerHTML = ok
    ? `<div class="big g">GOAL!</div><div class="heb">${GOOD[Math.floor(Math.random()*GOOD.length)]}</div><div class="ans"><span class="en">${esc(show)}</span></div>${heb}`
    : `<div class="big s">SAVED</div><div class="heb">${BAD[Math.floor(Math.random()*BAD.length)]}</div><div class="ans">התשובה: <span class="en">${esc(show)}</span></div>${heb}<button class="next" id="next">לבעיטה הבאה ←</button>`;
  $("#flash").classList.add("show");
  const go=()=>{ if(!M||M.advanced===M.idx) return; M.advanced=M.idx; M.idx++; nextShot(); };
  if(ok) setTimeout(go,1500); else $("#next").onclick=go;
}

function endMatch(){
  if(M.test) return endTest();
  const n=M.i+1, g=M.goals;
  const stars = g>=10?3:g>=9?2:g>=PASS?1:0;
  const won = g>=PASS;
  if(stars>(P.stars[n]||0)) P.stars[n]=stars;
  const ev=EK.evaluate(n,g,SHOTS);
  save(); whistle();
  const mPct=ev.mastery===null?null:Math.round(ev.mastery*100);
  const rw=collectRewards(RB);
  if(won||rw.any) setTimeout(()=>confetti(innerWidth/2, innerHeight*.3),250);
  const last = n===STAGES.length;
  const uniqMissed=[...new Map(M.missed.map(q=>[q.answer,q])).values()];
  app.innerHTML = topbar() + `
  <section class="result">
    <div class="trophy">${won?(last?"🏆":"🥇"):"💪"}</div>
    <h2>${won?(last?"אורחי אלוף העונה!":"ניצחון, אורחי!"):"עוד אימון אחד, אורחי"}</h2>
    <div class="final">${g} - ${SHOTS-g}</div>
    <div class="stars" aria-label="${stars} כוכבים">${starStr(stars)}</div>
    ${rw.html}
    ${ev.why==="jump"?`<div class="jump">🚀 קפיצת מדרגה! 10 מתוך 10, אז דילגת ישר למחזור ${ev.to}</div>`:""}
    ${ev.why==="mastery"&&!won?`<div class="jump">📈 הרמה שלך במחזור הזה ${mPct}%, אז מחזור ${n+1} נפתח</div>`:""}
    <p>${won?(last?"עברת את כל המחזורים. אפשר לחזור ולאסוף 3 כוכבים בכל אחד.":`${ev.why==="jump"?"":`מחזור ${n+1} נפתח. `}${stars<3?"רוצה לנסות לאסוף 3 כוכבים כאן?":"משחק מושלם!"}`):(ev.why==="mastery"?"":`צריך ${PASS} שערים כדי לעלות. הבקעת ${g}, עוד קצת וזה שלך.`)}</p>
    ${mPct!==null?`<div class="mbar"><span>הרמה שלך במחזור ${n}</span><div><i style="width:${mPct}%"></i></div><b>${mPct}%</b></div>`:""}
    ${uniqMissed.length?`<p>מילים לחזרה (לחץ לשמוע):</p><div class="review">${uniqMissed.map(q=>`<button class="en" data-say="${esc(q.say)}">${esc(q.show||q.answer)}</button>`).join("")}</div>`:""}
    <div class="row">
      ${P.unlocked>n&&!last?`<button class="cta" id="nextStage">למחזור ${Math.min(P.unlocked,STAGES.length)} ←</button>`:""}
      <button class="cta ${P.unlocked>n&&!last?"alt":""}" id="again">שחק שוב</button>
      <button class="cta alt" id="back">לעמוד הראשי</button>
    </div>
  </section>`;
  bindMute();
  app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));
  $("#again").onclick=()=>startMatch(M.i);
  $("#back").onclick=home;
  const ns=$("#nextStage"); if(ns) ns.onclick=()=>startMatch(Math.min(P.unlocked,STAGES.length)-1);
}

  bindMute();
  $("#again").onclick=()=>d.start(lv);
  $("#back").onclick=home;
  const u=$("#up"); if(u) u.onclick=()=>d.start(lv+1);
}

/* drill 1: pass in ABC order */
const SLOTS=[[16,40],[50,38],[84,40],[14,60],[38,57],[62,59],[86,62],[26,80],[74,80],[50,76]];
function startPass(lv){
  stopDrill();
  const d=DRILLS[0], len=lv===0?4:6, lower=lv===2, ROUNDS=5;
  D={alive:true, round:0, mist:0, busy:false};
  drillShell(d,lv,
    `<div class="stat"><span class="n" id="pr">1/${ROUNDS}</span><span class="l">התקפה</span></div><div class="stat"><span class="n" id="pm">0</span><span class="l">טעויות</span></div>`,
    `<div class="prompt drill-prompt"><div class="vis">🏃</div><div><div class="ask" id="pask"></div><div class="sub" id="psub"></div></div><span></span></div>
     <div class="field" id="field"><canvas class="stands" id="stands"></canvas><div class="minigoal"></div><div class="pball" id="pball"></div><div class="lights"></div><div class="flash" id="flash"><div class="box" id="flashbox"></div></div></div>`);
  const field=$("#field"), ball=$("#pball"), cv=mountCrowd($("#stands"));
  const place=(x,y)=>{ ball.style.left=x+"%"; ball.style.top=y+"%"; };
  function hint(){ $("#psub").innerHTML = lv===0 ? `הבא בתור: <span class="en">${D.seq[D.next]}</span>` : `מסירה ${D.next+1} מתוך ${len}`; }
  function round(){
    if(!D||!D.alive) return;
    D.round++; $("#pr").textContent=`${D.round}/${ROUNDS}`;
    const s=Math.floor(Math.random()*(26-len+1));
    let seq=LETTERS.slice(s,s+len); if(lower) seq=seq.map(c=>c.toLowerCase());
    D.seq=seq; D.next=0; D.wrongHere=0;
    field.querySelectorAll(".player").forEach(p=>p.remove());
    const slots=shuffle(SLOTS).slice(0,len);
    seq.forEach((L,k)=>{ const b=document.createElement("button"); b.className="player en"; b.innerHTML=SHIRT+`<span class="pl">${L}</span>`; b.style.left=slots[k][0]+"%"; b.style.top=slots[k][1]+"%"; b.onclick=()=>tap(b); field.appendChild(b); });
    ball.style.transition="none"; place(50,93); void ball.offsetWidth; ball.style.transition="";
    $("#pask").innerHTML=`מסור לפי הסדר: <span class="en">${seq[0]} → ${seq[len-1]}</span>`;
    hint();
    $("#flash").classList.remove("show");
  }
  function tap(b){
    if(!D||D.busy||b.classList.contains("done")) return;
    const L=D.seq[D.next];
    if(b.textContent===L){
      b.classList.add("done"); b.classList.remove("hint");
      place(parseFloat(b.style.left), parseFloat(b.style.top)+7);
      say(L.toUpperCase()+"."); D.next++; D.wrongHere=0;
      if(D.next===len){
        D.busy=true;
        D.t1=setTimeout(()=>{ if(!D) return; place(50,19); crowd(true); if(cv) cv.cheer();
          { const r=field.getBoundingClientRect(); confetti(r.left+r.width/2, r.top+r.height*.2); }
          D.t1=setTimeout(()=>{ if(!D) return;
            $("#flashbox").innerHTML=`<div class="big g">GOAL!</div><div class="heb">מסירות מושלמות</div><div class="ans"><span class="en">${D.seq.join(" ")}</span></div>`;
            $("#flash").classList.add("show");
            D.t1=setTimeout(()=>{ if(!D) return; D.busy=false; D.round>=ROUNDS ? finish() : round(); },1500);
          },450);
        },350);
      } else hint();
    } else {
      b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
      D.mist++; D.wrongHere++; $("#pm").textContent=D.mist; crowd(false);
      if(D.wrongHere>=2){ const c=[...field.querySelectorAll(".player")].find(p=>p.textContent===L); if(c) c.classList.add("hint"); say(L.toUpperCase()+"."); }
    }
  }
  function finish(){ const m=D.mist, stars=m<=1?3:m<=4?2:1;
    drillEnd(d,lv,stars, stars===3?"מסירות של אלופים!":"כל הכבוד!", `השלמת ${ROUNDS} התקפות עם ${m} טעויות.${stars<3?" עם טעות אחת לכל היותר מקבלים 3 כוכבים.":""}`); }
  round();
}

/* drill 2: keeper — save only the target letter */
function startKeeper(lv){
  stopDrill();
  const d=DRILLS[1], DUR=40;
  const GROUPS=[["b","d","p","q"],["m","n","w","u"],["i","l","j","t"],["c","e","o","a"],["h","n","r","u"]];
  let pool, targets;
  if(lv===0){ pool=LETTERS; targets=shuffle(LETTERS).slice(0,2); }
  else if(lv===1){ pool=LETTERS.map(c=>c.toLowerCase()); targets=shuffle(pool).slice(0,2); }
  else { pool=shuffle(GROUPS)[0]; targets=shuffle(pool).slice(0,2); }
  const speed=[70,85,95][lv], every=[1250,1100,950][lv];
  D={alive:true, saved:0, conceded:0, wrong:0, balls:[], ti:0, left:DUR};
  drillShell(d,lv,
    `<div class="stat"><span class="n" id="kt">${DUR}</span><span class="l">שניות</span></div><div class="stat"><span class="n" id="ks">0</span><span class="l">הצלות</span></div><div class="stat"><span class="n" id="kc">0</span><span class="l">ספגת</span></div>`,
    `<div class="prompt drill-prompt"><div class="vis big-en en" id="ktarget"></div><div><div class="ask">תעצור רק כדורים עם האות הזאת</div><div class="sub">כדור עם אות אחרת? תן לו לעבור</div></div><button class="speak" id="kspeak" aria-label="השמע שוב">🔊</button></div>
     <div class="field" id="field"><div class="flash" id="flash"><div class="box" id="flashbox"></div></div></div>`);
  const field=$("#field");
  function setT(){ D.target=targets[D.ti]; $("#ktarget").textContent=D.target; say(D.target.toUpperCase()+"."); const s=$("#kspeak"); s.classList.remove("pulse"); void s.offsetWidth; s.classList.add("pulse"); }
  $("#kspeak").onclick=()=>say(D.target.toUpperCase()+".");
  setT();
  function spawn(){
    if(!D||!D.alive) return;
    const isT=Math.random()<.42, L=isT?D.target:pickOthers(pool,D.target,1)[0];
    const el=document.createElement("button"); el.className="fball en"; el.textContent=L;
    el.style.left=(8+Math.random()*Math.max(0,field.clientWidth-84))+"px";
    const b={el,y:-72,L,dead:false}; el.style.transform=`translateY(${b.y}px)`;
    el.onpointerdown=e=>{ e.preventDefault(); hit(b); };
    field.appendChild(el); D.balls.push(b);
  }
  function hit(b){
    if(b.dead||!D) return; b.dead=true;
    if(b.L===D.target){ D.saved++; $("#ks").textContent=D.saved; b.el.textContent="🧤"; b.el.classList.add("saved"); }
    else { D.wrong++; b.el.classList.add("bad"); crowd(false); }
    setTimeout(()=>b.el.remove(),380);
  }
  let last=performance.now();
  function loop(now){
    if(!D||!D.alive) return;
    const dt=Math.min(.05,(now-last)/1000); last=now; const H=field.clientHeight;
    for(const b of D.balls){ if(b.dead) continue; b.y+=speed*dt; b.el.style.transform=`translateY(${b.y}px)`;
      if(b.y>H-12){ b.dead=true; b.el.remove();
        if(b.L===D.target){ D.conceded++; $("#kc").textContent=D.conceded; crowd(false); field.classList.remove("hitflash"); void field.offsetWidth; field.classList.add("hitflash"); } } }
    D.balls=D.balls.filter(b=>!b.dead);
    D.raf=requestAnimationFrame(loop);
  }
  function finish(){ const s=D.saved,c=D.conceded,w=D.wrong, tot=s+c+w, acc=tot?s/tot:0, stars=acc>=.9?3:acc>=.7?2:acc>=.4?1:0;
    drillEnd(d,lv,stars, stars>=2?"שוער נבחרת!":stars===1?"עצירות יפות!":"עוד אימון אחד", `עצרת ${s} כדורים, ספגת ${c}, ונגעת ב-${w} כדורים עם אות לא נכונה.`); }
  D.iv=setInterval(()=>{ if(!D) return; D.left--; $("#kt").textContent=D.left;
    if(D.left===DUR/2){ D.ti=1; setT();
      $("#flashbox").innerHTML=`<div class="heb">אות חדשה!</div><div class="big g en">${D.target}</div>`; $("#flash").classList.add("show");
      D.t1=setTimeout(()=>{ if(D) $("#flash").classList.remove("show"); },1300); }
    if(D.left<=0) finish(); },1000);
  D.sp=setInterval(spawn,every); spawn();
  D.raf=requestAnimationFrame(loop);
}

/* drill 3: shirt memory — upper/lower pairs */
function startMemory(lv){
  stopDrill();
  const d=DRILLS[2], pairs=[6,8,10][lv];
  const cards=shuffle(shuffle(LETTERS).slice(0,pairs).flatMap(L=>[{L,face:L},{L,face:L.toLowerCase()}]));
  D={alive:true, open:[], moves:0, found:0, lock:false};
  drillShell(d,lv,
    `<div class="stat"><span class="n" id="mm">0</span><span class="l">ניסיונות</span></div><div class="stat"><span class="n" id="mf">0/${pairs}</span><span class="l">זוגות</span></div>`,
    `<div class="prompt drill-prompt"><div class="vis">👕</div><div><div class="ask">הפוך שתי חולצות ומצא זוג</div><div class="sub">אות גדולה ואותה אות קטנה, למשל <span class="en">B b</span></div></div><span></span></div>
     <div class="mem" id="mem">${cards.map((c,i)=>`<button class="card" data-i="${i}" aria-label="חולצה ${i+1}"><span class="back">${SHIRT}</span><span class="front en">${c.face}</span></button>`).join("")}</div>`);
  $("#mem").querySelectorAll(".card").forEach(b=>b.onclick=()=>flip(b,cards[+b.dataset.i]));
  function flip(b,c){
    if(!D||D.lock||b.classList.contains("up")) return;
    b.classList.add("up"); say(c.L+"."); D.open.push([b,c]);
    if(D.open.length<2) return;
    D.moves++; $("#mm").textContent=D.moves;
    const [[b1,c1],[b2,c2]]=D.open; D.open=[];
    if(c1.L===c2.L){ b1.classList.add("match"); b2.classList.add("match"); D.found++; $("#mf").textContent=`${D.found}/${pairs}`; crowd(true);
      if(D.found===pairs) D.t1=setTimeout(finish,900); }
    else { D.lock=true; D.t1=setTimeout(()=>{ if(!D) return; b1.classList.remove("up"); b2.classList.remove("up"); D.lock=false; },1000); }
  }
  function finish(){ const m=D.moves, stars=m<=pairs+3?3:m<=Math.round(pairs*1.8)?2:1;
    drillEnd(d,lv,stars, stars===3?"זיכרון של קפטן!":"מצאת את כולם!", `מצאת ${pairs} זוגות ב-${m} ניסיונות.${stars<3?` ב-${pairs+3} ניסיונות או פחות מקבלים 3 כוכבים.`:""}`); }
}

home();
})();
</script>
